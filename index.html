<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EzAdmin NaiveUI</title>

    <!-- ========== 主题预加载脚本 ========== -->
    <!-- 在页面渲染前执行，防止首次加载闪烁 -->
    <script>
      const isDark = JSON.parse(localStorage.getItem('theme-store') || '{}')?.isDark
      if (isDark) document.documentElement.classList.add('dark')
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
