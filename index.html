<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EzAdmin NaiveUI</title>

    <!-- ========== 主题预加载脚本 ========== -->
    <!-- 在页面渲染前执行，防止首次加载闪烁 -->
    <script>
      (function() {
        try {
          // 读取用户选择
          const themeStore = localStorage.getItem('theme-store')
          if (themeStore) {
            const { isDark } = JSON.parse(themeStore)

            // 在 CSS 加载前添加 dark 类
            if (isDark) {
              document.documentElement.classList.add('dark')
            }
          }
        } catch (e) {
          console.error('Failed to restore theme:', e)
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
